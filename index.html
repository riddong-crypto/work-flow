<meta charset="utf-8">
<title>사업계획서 · 결과보고서 작성 도구</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<style>
  :root{
    --ink:#1B2430; --ink-2:#4A5765; --ink-3:#7E8A97;
    --line:#D7DDE4; --line-soft:#E8ECF0;
    --field:#FFFFFF; --chrome:#EDF0F3; --sheet:#FFFFFF;
    --accent:#5B3E8E; --accent-soft:#EFE9F7; --accent-line:#B9A5D8;
    --warn:#9A3B2F; --ok:#2E6B54;
    --ui:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  }
  body.report{--accent:#1F6E63;--accent-soft:#E4F1EE;--accent-line:#9CC6BE}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:var(--ui);background:var(--chrome);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}

  .bar{position:sticky;top:0;z-index:40;background:var(--sheet);border-bottom:1px solid var(--line);
       padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .bar h1{font-size:14.5px;font-weight:700;margin:0}
  .bar h1 span{display:block;font-size:11.5px;font-weight:500;color:var(--ink-3)}
  .ctrl{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  .acts .btn{flex:0 0 auto}
  .spacer{flex:1}
  .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-shrink:0}
  .seg button{border:none;background:var(--sheet);color:var(--ink-2);padding:8px 14px;font-size:12.5px;cursor:pointer;white-space:nowrap;touch-action:manipulation}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--accent);color:#fff}
  .seg button.on.neutral{background:var(--ink-2)}
  .status{font-size:12px;color:var(--ink-3);white-space:nowrap}
  .status.on{color:var(--ok)}
  .status.dirty{color:var(--warn)}
  .btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink-2);padding:8px 12px;border-radius:6px;font-size:12.5px;cursor:pointer;white-space:nowrap;touch-action:manipulation}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.sm{padding:6px 10px;font-size:11.5px}
  @media (hover:hover){
    .btn:hover{background:#F5F7F9;border-color:#C3CBD4}
    .btn.pri:hover{filter:brightness(.9)}
    .btn.danger:hover{color:var(--warn);border-color:#DDBAB4}
    .del:hover{color:var(--warn);background:#FBF0EE}
    .add:hover{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
  }

  .wrap{display:grid;grid-template-columns:minmax(400px,45%) 1fr;height:calc(100dvh - 62px)}
  .pane{overflow-y:auto;height:100%;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .form{background:var(--chrome);padding:18px 18px 120px}
  .prev{background:#E3E7EB;padding:26px 20px 90px;border-left:1px solid var(--line)}

  details.card{background:var(--sheet);border:1px solid var(--line);border-radius:9px;margin-bottom:14px;overflow:hidden}
  details.card > summary{display:flex;align-items:baseline;gap:9px;padding:12px 15px;cursor:pointer;list-style:none;border-bottom:1px solid var(--line-soft)}
  summary::-webkit-details-marker{display:none}
  .sec-no{font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 6px;white-space:nowrap}
  .sec-t{font-size:13.5px;font-weight:650}
  .sec-hint{font-size:11.5px;color:var(--ink-3);margin-left:auto;text-align:right}
  .body{padding:14px 15px 16px}

  .row{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:start;margin-bottom:9px}
  .row > label{font-size:12.5px;color:var(--ink-2);padding-top:8px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  h4.fl{font-size:12.5px;margin:18px 0 7px;color:var(--ink-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  h4.fl:first-child{margin-top:0}

  input[type=text],textarea,select{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-family:inherit;font-size:13px;color:var(--ink);background:var(--field)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  textarea{resize:vertical;line-height:1.5}
  input.num{text-align:right;font-variant-numeric:tabular-nums}

  table.edit{width:100%;border-collapse:collapse}
  table.edit th{font-size:11.5px;font-weight:600;color:var(--ink-3);text-align:left;padding:0 4px 6px}
  table.edit td{padding:2px 3px;vertical-align:top}
  table.edit td input,table.edit td textarea{padding:6px 7px;font-size:12.5px}
  .del{border:none;background:none;color:var(--ink-3);cursor:pointer;font-size:15px;line-height:1;padding:6px 4px;border-radius:4px}
  .del:hover{color:var(--warn);background:#FBF0EE}
  .add{margin-top:8px;border:1px dashed var(--line);background:none;color:var(--ink-2);width:100%;padding:7px;border-radius:6px;font-size:12.5px;cursor:pointer}
  .add:hover{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
  .btn2{display:flex;gap:6px}
  .sum{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:9px 11px;background:var(--accent-soft);border-radius:6px;font-size:13px}
  .sum b{font-variant-numeric:tabular-nums;font-size:14px;color:var(--accent)}
  .hint{font-size:11.5px;color:var(--ink-3);margin:0 0 10px}
  .shared{display:inline-flex;align-items:center;font-size:11px;font-weight:600;color:var(--ink-2);background:#EEF1F4;border-radius:4px;padding:2px 7px}
  .notice{border:1px solid var(--line);background:#F7F9FA;border-radius:7px;padding:11px 13px;font-size:12.5px;color:var(--ink-2);margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .notice b{color:var(--ink)}

  .blk{border:1px solid var(--line);border-radius:7px;padding:10px 11px;margin-bottom:11px;background:#FCFDFD}
  .blk-h{display:flex;gap:6px;align-items:center;margin-bottom:8px}
  .blk-t{flex:1;font-weight:650}
  .blk-h select{width:auto;padding:6px 8px;font-size:12.5px}
  .colh{display:flex;gap:2px;align-items:center}
  .colh input{padding:5px 6px;font-size:11.5px;font-weight:600;background:#F5F7F9}
  .colh .del{font-size:12px;padding:3px}
  .badge{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap}
  .badge.same{background:#EEF1F4;color:var(--ink-3)}
  .badge.diff{background:var(--accent-soft);color:var(--accent)}

  .brow{border:1px solid var(--line);border-radius:7px;padding:9px 10px;margin-bottom:9px;background:#FCFDFD}
  .bline{display:flex;gap:6px;align-items:center;margin-bottom:6px}
  .bname{flex:1;font-weight:600}
  .bcalc{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:6px}
  .bl{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
  .btag{font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap}
  .btag.p{background:#EEF1F4;color:var(--ink-2)}
  .btag.a{background:var(--accent-soft);color:var(--accent)}
  .bx{color:var(--ink-3);font-size:12px}
  .bp{width:92px}.bq{width:52px}.bu{width:50px;padding:6px}
  .bcalc input{padding:6px 7px;font-size:12.5px}
  .chk{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-3);white-space:nowrap;cursor:pointer}
  .chk input{accent-color:var(--accent);margin:0}
  .bout{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px dashed var(--line);padding-top:7px}
  .bbasis{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .bamt{font-size:13.5px;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}

  .sheet{max-width:780px;margin:0 auto;background:var(--sheet);padding:52px 56px 64px;box-shadow:0 1px 2px rgba(27,36,48,.10),0 12px 30px rgba(27,36,48,.09);font-size:13.2px;line-height:1.72}
  .doc-kicker{font-size:12px;color:var(--accent);font-weight:600;margin:0 0 6px}
  .doc-title{font-size:25px;font-weight:750;letter-spacing:-.02em;line-height:1.3;margin:0 0 4px}
  .doc-sub{font-size:14px;color:var(--ink-2);margin:0 0 16px;font-weight:500}
  .doc-meta{display:flex;gap:22px;font-size:12px;color:var(--ink-3);border-top:2px solid var(--accent);border-bottom:1px solid var(--line);padding:9px 0;margin-bottom:26px}
  h2.dh{font-size:15.5px;font-weight:700;margin:32px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--ink)}
  h3.dh3{font-size:13.4px;font-weight:650;margin:20px 0 8px}
  h3.dh3::before{content:"○ ";color:var(--accent)}
  h4.dh4{font-size:12.6px;font-weight:650;margin:14px 0 6px;color:var(--ink-2)}
  ul.d{margin:0 0 4px;padding-left:17px} ul.d li{margin-bottom:3px}
  ol.d{margin:0;padding-left:19px}
  table.doc{width:100%;border-collapse:collapse;font-size:12.4px;margin:4px 0 6px}
  table.doc th{background:var(--accent-soft);border:1px solid var(--line);padding:7px 9px;font-weight:650;text-align:left}
  table.doc td{border:1px solid var(--line);padding:7px 9px;vertical-align:top}
  table.doc td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  table.doc tr.total td{background:var(--accent-soft);font-weight:700}
  .cap{display:block;font-size:11px;color:var(--ink-3);margin-bottom:1px}
  .unit{text-align:right;font-size:11.5px;color:var(--ink-3);margin:0 0 3px}
  .callout{border-left:3px solid var(--accent-line);background:#FAFAFC;padding:9px 13px;font-size:12.2px;color:var(--ink-2);margin:8px 0 0}
  .invite{background:#F8F8FB;border:1px solid var(--line-soft);padding:20px 24px;white-space:pre-wrap;line-height:1.85;font-size:13px}
  .empty{color:#B4BDC6}
  .sheet{word-break:keep-all;overflow-wrap:break-word}
  p.para{margin:0 0 6px}
  p.cl{margin:0}
  p.hang{margin-left:.75em;text-indent:-.75em}

  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:var(--ink);color:#fff;padding:9px 17px;border-radius:7px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:99}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .tabs{display:none}

  /* 가로로 넘칠 수 있는 표는 스크롤 */
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px;padding:0 2px}
  .tblwrap > table.edit{min-width:460px}
  .tblwrap > table.doc{min-width:520px}

  /* ── 터치 기기: 탭 영역 넓히고 iOS 자동 확대 방지 ── */
  @media (pointer:coarse){
    input[type=text],textarea,select{font-size:16px;padding:9px 10px}
    table.edit td input,table.edit td textarea,.bcalc input,.colh input{font-size:16px}
    .btn,.seg button{padding:11px 14px;font-size:13.5px}
    .btn.sm{padding:9px 12px;font-size:12.5px}
    .del{min-width:40px;min-height:40px;font-size:19px}
    .add{padding:12px;font-size:13.5px}
    .chk{padding:6px 2px}
    .chk input{width:20px;height:20px}
    details.card > summary{padding:15px}
    .bp{width:110px}.bq{width:64px}.bu{width:64px}
    .colh input{padding:8px 7px}
  }

  /* ── 태블릿·모바일: 위아래로 쌓고 작성/미리보기 전환 ── */
  @media (max-width:1200px){
    html,body{height:auto}
    .wrap{grid-template-columns:1fr;height:auto}
    .pane{height:auto;overflow:visible}
    .prev{border-left:none;border-top:1px solid var(--line);padding:20px 14px 80px}
    .sheet{padding:32px 26px 44px;max-width:none}
    .bar{padding:9px 14px}
    .bar h1{flex:1;min-width:150px}
    .bar h1 span{display:none}
    .ctrl{flex:0 0 auto}
    .acts{order:4;width:100%;overflow-x:auto;padding-bottom:2px;flex-wrap:nowrap}
    .tabs{order:3;display:flex;width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden}
    .tabs button{flex:1;border:none;background:var(--sheet);color:var(--ink-2);padding:11px;font-size:13.5px;cursor:pointer;font-family:inherit;touch-action:manipulation}
    .tabs button+button{border-left:1px solid var(--line)}
    .tabs button.on{background:var(--accent);color:#fff}
    .form,.prev{display:none}
    body.t-form .form{display:block}
    body.t-prev .prev{display:block}
  }

  /* ── 좁은 화면(세로 아이패드·휴대폰) ── */
  @media (max-width:760px){
    .bar{padding:8px 12px;gap:8px}
    .bar h1{display:none}
    .ctrl{width:100%;flex:1 1 100%}
    .seg{flex:1}
    .seg button{flex:1;padding:10px 6px;font-size:12.5px;text-align:center}
    .status{font-size:11px}
    .acts{gap:5px}
    .acts .btn{padding:9px 10px;font-size:12.5px}
    .form{padding:14px 12px 90px}
    .sheet{padding:24px 18px 36px;font-size:13px}
    .doc-title{font-size:21px}
    .row{grid-template-columns:1fr;gap:4px}
    .row > label{padding-top:0;font-weight:600}
    .grid2{grid-template-columns:1fr}
    .doc-meta{flex-wrap:wrap;gap:6px 16px}
    .blk-h{flex-wrap:wrap}
    .blk-t{flex:1 0 100%;margin-bottom:4px}
    .bcalc{gap:5px}
    .notice{font-size:12px}
  }

  @media print{
    @page{size:A4;margin:16mm 15mm}
    .bar,.form,.tabs,.toast{display:none !important}
    body{background:#fff}
    .wrap{display:block;height:auto} .pane{overflow:visible;height:auto}
    .prev{background:#fff;padding:0;border:none}
    .sheet{box-shadow:none;max-width:none;padding:0;font-size:10.5pt}
    h2.dh,h3.dh3,h4.dh4,.unit{page-break-after:avoid;break-after:avoid}
    table.doc tr,.invite,.callout{page-break-inside:avoid;break-inside:avoid}
    table.doc thead{display:table-header-group}
    p,li{orphans:2;widows:2}
    .tblwrap{overflow:visible !important;margin:0}
    .tblwrap > table.doc{min-width:0 !important}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

<div class="bar">
  <h1>마포 사업문서 작성 도구<span>마포구 사회적경제통합지원센터</span></h1>
  <div class="ctrl">
    <div class="seg" id="seg">
      <button id="t-common" onclick="setTab('common')">공통 정보</button>
      <button id="t-plan" onclick="setTab('plan')">사업계획서</button>
      <button id="t-report" onclick="setTab('report')">결과보고서</button>
    </div>
    <div class="spacer"></div>
    <div class="status" id="status">불러오는 중</div>
  </div>
  <div class="acts">
    <button class="btn" onclick="impOpen()">기획안으로 채우기</button>
    <button class="btn" onclick="dlData()">사업파일 저장</button>
    <button class="btn" onclick="document.getElementById('fin').click()">불러오기</button>
    <button class="btn" onclick="copyDoc()">문서 복사</button>
    <button class="btn" onclick="dlWord()">워드로 저장</button>
    <button class="btn danger" onclick="clearAll()">초기화</button>
    <button class="btn" onclick="resetAll()">예시 채우기</button>

  </div>

  <div class="tabs">
    <button id="p-form" onclick="pane('form')">작성</button>
    <button id="p-prev" onclick="pane('prev')">미리보기</button>
  </div>
</div>

<div class="wrap">
  <div class="pane form" id="form"></div>
  <div class="pane prev"><div class="sheet" id="sheet"></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= 유틸 ================= */
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nl  = s => esc(s).replace(/\n/g,'<br>');
/* 표 칸: 줄마다 단락으로, '- ' 로 시작하는 줄은 내어쓰기 */
const cell = s => {
  const t=String(s??'').replace(/^\n+|\n+$/g,'');
  if(!t.includes('\n'))return esc(t);
  return t.split('\n').map(l=>{
    if(!l.trim())return '<p class="cl">&nbsp;</p>';
    return '<p class="cl'+(/^\s*[-·•]\s/.test(l)?' hang':'')+'">'+esc(l.trim())+'</p>';
  }).join('');
};
/* 서술형: 줄(Enter)마다 새 문단 */
const paras = (t,ph) => {
  const a=lines(t);
  return a.length ? a.map(x=>'<p class="para">'+esc(x.trim())+'</p>').join('')
                  : '<p class="para"><span class="empty">'+ph+'</span></p>';
};
const num = v => Number(String(v??'').replace(/[^0-9.-]/g,''))||0;
const won = n => (num(n)).toLocaleString('ko-KR');
const val = (s,ph) => s && String(s).trim() ? nl(s) : '<span class="empty">'+ph+'</span>';
const lines = t => String(t||'').split('\n').filter(x=>x.trim());
const cp = o => JSON.parse(JSON.stringify(o));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),1900);}
function pane(w){
  document.body.classList.remove('t-form','t-prev');document.body.classList.add('t-'+w);
  const f=document.getElementById('p-form'),v=document.getElementById('p-prev');
  if(f&&v){f.className=w==='form'?'on':'';v.className=w==='prev'?'on':'';}
  window.scrollTo(0,0);
}

function emptyCalc(){return {p:'',f:[{v:'',u:''},{v:'',u:''},{v:'',u:''}],manual:false,c:'',amt:''};}
function calc(p,f){const o=emptyCalc();o.p=String(p);(f||[]).forEach((x,i)=>o.f[i]={v:String(x[0]),u:x[1]});return o;}
function calcCell(r){
  if(!r)return{amt:0,basis:''};
  if(r.manual)return{amt:num(r.amt),basis:r.c||''};
  const price=num(r.p);
  const fs=(r.f||[]).filter(f=>f&&String(f.v).trim()!==''&&num(f.v)!==0);
  const amt=fs.reduce((s,f)=>s*num(f.v),price);
  let basis=price?price.toLocaleString('ko-KR')+'원':'';
  fs.forEach(f=>{basis+=(basis?' × ':'')+num(f.v).toLocaleString('ko-KR')+(f.u||'');});
  return {amt:Math.round(amt),basis};
}

/* ================= 데이터 ================= */
function seed(){return {
  tab:'plan', mode:'plan',

  common:{
    category:"event",
    kicker:"2026 마포돌봄캠퍼스 전문가 과정",
    title:"돌봄통합지원법의 현재, 민간의 역할과 과제",
    target:"마포 지역돌봄회 임직원 50명 내외",
    period:"2026.08.20. ~ 2026.09.23.",
    writer:"이동은",
    writeDate:"2026. 8. 20",
    reportDate:"2026. 9. 23",
    org:"마포구 사회적경제통합지원센터",
    background:[

function blockBlank(b){
  if(b.type!=='table')return !String(b.text||'').trim();
  const mine=JSON.stringify(b.rows||[]);
  if(Object.values(CATS).some(t=>t.blocks().some(x=>x.t===b.t&&JSON.stringify(x.rows)===mine)))return true;
  return (b.rows||[]).every(r=>r.slice(1).every(x=>!String(x||'').trim()));
}
function applyCategory(cat){
  const tpl=CATS[cat];if(!tpl)return;
  const c=C();
  const allLabels=new Set(),allTitles=new Set();
  Object.values(CATS).forEach(t=>{t.outline.forEach(l=>allLabels.add(l));t.blocks().forEach(b=>allTitles.add(b.t));});
  /* 개요 항목: 새 유형 항목 먼저(입력값 유지), 나머지는 값이 있거나 다른 유형 기본항목이 아니면 유지 */
  const old=c.outline||[],used=new Set();
  const row=tpl.outline.map(l=>{const f=old.find(r=>r.k===l);if(f){used.add(f);return f;}return {k:l,v:''};});
  const keep=old.filter(r=>!used.has(r)&&(String(r.v||'').trim()||!allLabels.has(r.k)));
  c.outline=row.concat(keep);
  /* 사업내용: 새 유형 항목 먼저(입력값 유지), 입력값 없는 다른 유형 기본항목만 제거 */
  const ob=c.content||[],ub=new Set();
  const blocks=tpl.blocks().map(nb=>{const f=ob.find(b=>b.t===nb.t);if(f){ub.add(f);return f;}return nb;});
  const keepB=ob.filter(b=>!ub.has(b)&&!(allTitles.has(b.t)&&blockBlank(b)));
  c.content=blocks.concat(keepB);
}
function setCategory(v){
  C().category=v;applyCategory(v);render();
  toast('“'+CATS[v].name+'” 유형으로 바꿨습니다 — 입력한 내용은 그대로 유지됩니다');
}
function categoryRow(){
  const cur=C().category||'event';
  return '<div class="row"><label>사업유형</label><select onchange="setCategory(this.value)">'
   +Object.keys(CATS).map(k=>'<option value="'+k+'"'+(k===cur?' selected':'')+'>'+CATS[k].name+'</option>').join('')+'</select></div>'
   +'<p class="hint" style="margin:-4px 0 10px">유형을 바꾸면 사업개요 항목명과 사업내용 기본 항목이 그 유형에 맞게 바뀝니다. 이미 입력한 내용은 지워지지 않습니다.</p>';
}

function titleLine(){
  const m=C(),t=x=>String(x==null?'':x).trim();
  return [t(m.kicker),t(m.title)].filter(Boolean).join(' - ');
}
function acctPicker(){
  return '<div class="row"><label>계획서 과목</label><select onchange="applyAcct(this.value)"><option value="">2026 사업계획서에서 선택…</option>'
   +ACCT.map((a,i)=>'<option value="'+i+'">'+esc(a[1]+' › '+a[2])+'</option>').join('')+'</select></div>'
   +'<p class="hint" style="margin:-4px 0 10px">고르면 항·목·세목이 채워지고, 문서 맨 윗줄에 ‘항 - 목 (세목)’으로 표시됩니다. 채운 뒤 직접 고칠 수 있어요.</p>';
}

let S = seed();
const KEY='mapo:docs:v3';
const C = () => S.common;
const M = () => S.mode;

/* ================= 상태 ================= */
function set(path,v){const p=path.split('.');let o=S;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=v;render(true);}
function get(path){return path.split('.').reduce((o,k)=>o?.[k],S);}
function addRow(arr,obj){get(arr).push(typeof obj==='object'?cp(obj):obj);render();}
function delRow(arr,i){get(arr).splice(i,1);render();}
function setTab(t){S.tab=t;if(t!=='common')S.mode=t;document.body.classList.toggle('report',M()==='report');render();window.scrollTo(0,0);}

function repContent(){return S.report.linked ? C().content : S.report.content;}
function repPath(){return S.report.linked ? 'common.content' : 'report.content';}
function unlink(){S.report.content=cp(C().content);S.report.linked=false;render();toast('실적으로 수정할 수 있습니다. 계획서는 그대로 유지됩니다');}
function relink(){if(!confirm('결과보고서에서 수정한 사업내용을 버리고 계획서 내용으로 되돌립니다. 계속할까요?'))return;
  S.report.linked=true;S.report.content=[];render();toast('계획서와 다시 연동했습니다');}
function pullToResults(){
  const src=repContent();
  if(!src||!src.length){toast('사업내용에 가져올 항목이 없습니다');return;}
  if((S.report.results||[]).length &&
     !confirm('사업내용 '+src.length+'개 항목을 사업성과 아래에 추가합니다. 계속할까요?'))return;
  S.report.results=(S.report.results||[]).concat(cp(src));
  render();toast('사업내용을 가져왔습니다 — 실적 중심으로 고쳐 쓰세요');
}
function blockDiff(i){
  if(S.report.linked)return null;
  const a=C().content[i],b=S.report.content[i];
  if(!a)return 'diff';
  return JSON.stringify(a)===JSON.stringify(b)?'same':'diff';
}

/* ================= 공통 편집기 ================= */
function inp(path,ph,cls){return '<input type="text" class="'+(cls||'')+'" value="'+esc(get(path))+'" placeholder="'+esc(ph||'')+'" oninput="set(\''+path+'\',this.value)">';}
function ta(path,ph,rows){return '<textarea rows="'+(rows||3)+'" placeholder="'+esc(ph||'')+'" oninput="set(\''+path+'\',this.value)">'+esc(get(path))+'</textarea>';}
function listEditor(arr,ph){
  const a=get(arr)||[];let h='';
  a.forEach((_,i)=>{h+='<div style="display:flex;gap:4px;margin-bottom:5px"><textarea rows="2" style="flex:1" placeholder="'+esc(ph)+'" oninput="set(\''+arr+'.'+i+'\',this.value)">'+esc(a[i])+'</textarea><button class="del" onclick="delRow(\''+arr+'\','+i+')">×</button></div>';});
  return h+'<button class="add" onclick="addRow(\''+arr+'\',\'\')">+ 항목 추가</button>';
}
function tableEditor(arr,cols){
  const a=get(arr)||[];
  let h='<div class="tblwrap"><table class="edit"><thead><tr>';
  cols.forEach(c=>h+='<th style="width:'+c.w+'">'+esc(c.t)+'</th>');
  h+='<th style="width:26px"></th></tr></thead><tbody>';
  a.forEach((row,i)=>{
    h+='<tr>';
    cols.forEach(c=>{const p=arr+'.'+i+'.'+c.k;
      h+='<td>'+(c.multi?'<textarea rows="2" oninput="set(\''+p+'\',this.value)">'+esc(row[c.k]??'')+'</textarea>'
        :'<input type="text" value="'+esc(row[c.k]??'')+'" placeholder="'+esc(c.ph||'')+'" oninput="set(\''+p+'\',this.value)">')+'</td>';});
    h+='<td><button class="del" onclick="delRow(\''+arr+'\','+i+')">×</button></td></tr>';
  });
  h+='</tbody></table></div>';
  const blank={};cols.forEach(c=>blank[c.k]='');
  return h+'<button class="add" onclick=\'addRow("'+arr+'",'+JSON.stringify(blank)+')\'>+ 행 추가</button>';
}
function card(no,title,hint,body){
  return '<details class="card" open><summary><span class="sec-no">'+no+'</span><span class="sec-t">'+title+'</span><span class="sec-hint">'+hint+'</span></summary><div class="body">'+body+'</div></details>';
}
const SHARED='<span class="shared">공통</span>';

const TYPES=[['table','표'],['list','목록'],['text','서술']];
function addBlock(p){get(p).push({t:"",type:"table",cols:["구분","내용"],w:["25%","auto"],rows:[["",""]],text:"",note:""});render();}
function delBlock(p,i){if(!confirm('“'+(get(p)[i].t||'제목 없는 항목')+'” 항목을 삭제할까요?'))return;get(p).splice(i,1);render();}
function moveBlock(p,i,d){const a=get(p),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];render();}
function setType(p,i,v){get(p)[i].type=v;render();}
function addCol(p,i){const b=get(p)[i];b.cols.push('');b.w.push('auto');b.rows.forEach(r=>r.push(''));render();}
function delCol(p,i,c){const b=get(p)[i];if(b.cols.length<=1){toast('열은 하나 이상 필요합니다');return;}b.cols.splice(c,1);b.w.splice(c,1);b.rows.forEach(r=>r.splice(c,1));render();}
function addBRow(p,i){const b=get(p)[i];b.rows.push(new Array(b.cols.length).fill(''));render();}
function delBRow(p,i,r){get(p)[i].rows.splice(r,1);render();}
function contentEditor(p,showDiff,label){
  let h='';
  (get(p)||[]).forEach((b,i)=>{
    const dif=showDiff?blockDiff(i):null;
    h+='<div class="blk"><div class="blk-h">'
      +'<input type="text" class="blk-t" value="'+esc(b.t)+'" placeholder="항목 제목 (예: 프로그램, 주요 사업내용)" oninput="set(\''+p+'.'+i+'.t\',this.value)">'
      +(dif?'<span class="badge '+dif+'">'+(dif==='same'?'계획과 동일':'수정됨')+'</span>':'')
      +'<select onchange="setType(\''+p+'\','+i+',this.value)">'+TYPES.map(t=>'<option value="'+t[0]+'"'+(b.type===t[0]?' selected':'')+'>'+t[1]+'</option>').join('')+'</select>'
      +'<button class="del" title="위로" onclick="moveBlock(\''+p+'\','+i+',-1)">↑</button>'
      +'<button class="del" title="아래로" onclick="moveBlock(\''+p+'\','+i+',1)">↓</button>'
      +'<button class="del" title="삭제" onclick="delBlock(\''+p+'\','+i+')">×</button></div>';
    if(b.type==='table'){
      h+='<div class="tblwrap"><table class="edit"><thead><tr>';
      b.cols.forEach((c,ci)=>{h+='<th'+(b.w?.[ci]&&b.w[ci]!=='auto'?' style="width:'+b.w[ci]+'"':'')+'><div class="colh"><input type="text" value="'+esc(c)+'" placeholder="열 이름" oninput="set(\''+p+'.'+i+'.cols.'+ci+'\',this.value)"><button class="del" onclick="delCol(\''+p+'\','+i+','+ci+')">×</button></div></th>';});
      h+='<th style="width:26px"></th></tr></thead><tbody>';
      b.rows.forEach((row,ri)=>{h+='<tr>';
        b.cols.forEach((_,ci)=>h+='<td><textarea rows="2" oninput="set(\''+p+'.'+i+'.rows.'+ri+'.'+ci+'\',this.value)">'+esc(row[ci]??'')+'</textarea></td>');
        h+='<td><button class="del" onclick="delBRow(\''+p+'\','+i+','+ri+')">×</button></td></tr>';});
      h+='</tbody></table></div><div class="btn2"><button class="add" onclick="addBRow(\''+p+'\','+i+')">+ 행 추가</button><button class="add" onclick="addCol(\''+p+'\','+i+')">+ 열 추가</button></div>';
    }else{
      h+='<textarea rows="6" placeholder="'+(b.type==='list'?'한 줄에 한 항목씩 입력':'문단으로 입력')+'" oninput="set(\''+p+'.'+i+'.text\',this.value)">'+esc(b.text||'')+'</textarea>';
    }
    h+='<textarea rows="2" style="margin-top:7px" placeholder="비고 (비우면 문서에서 숨김)" oninput="set(\''+p+'.'+i+'.note\',this.value)">'+esc(b.note||'')+'</textarea></div>';
  });
  return h+'<button class="add" onclick="addBlock(\''+p+'\')">+ '+(label||'사업내용')+' 항목 추가</button>';
}

const UNITS=['명','시간','회','부','식','개','일','건','매','팀','권','대'];
function toggleManual(path,on){const r=get(path);r.manual=on;
  if(on&&!r.c){const c=calcCell(Object.assign({},r,{manual:false}));r.c=c.basis;r.amt=String(c.amt);}render();}
function calcLine(path,tag,tagCls){
  const r=get(path);let h='<div class="bcalc"><span class="btag '+tagCls+'">'+tag+'</span>';
  if(r.manual){
    h+='<input type="text" style="flex:1;min-width:150px" value="'+esc(r.c)+'" placeholder="산출근거 직접 입력" oninput="set(\''+path+'.c\',this.value)">'
     +'<input type="text" class="num" style="width:100px" value="'+esc(r.amt)+'" placeholder="금액" oninput="set(\''+path+'.amt\',this.value)">';
  }else{
    h+='<input type="text" class="num bp" value="'+esc(r.p)+'" placeholder="단가" oninput="set(\''+path+'.p\',this.value)"><span class="bl">원</span>';
    for(let k=0;k<3;k++)h+='<span class="bx">×</span><input type="text" class="num bq" value="'+esc(r.f[k]?.v??'')+'" oninput="set(\''+path+'.f.'+k+'.v\',this.value)"><input type="text" class="bu" list="units" value="'+esc(r.f[k]?.u??'')+'" placeholder="단위" oninput="set(\''+path+'.f.'+k+'.u\',this.value)">';
  }
  return h+'<label class="chk"><input type="checkbox" '+(r.manual?'checked':'')+' onchange="toggleManual(\''+path+'\',this.checked)"> 직접</label></div>';
}
function budgetEditor(withActual){
  const p='common.budget';
  let h='<datalist id="units">'+UNITS.map(u=>'<option value="'+u+'">').join('')+'</datalist>';
  (get(p)||[]).forEach((r,i)=>{
    const pc=calcCell(r.pl),ac=calcCell(r.ac);
    h+='<div class="brow"><div class="bline"><input type="text" class="bname" value="'+esc(r.a)+'" placeholder="내역 / 과목" oninput="set(\''+p+'.'+i+'.a\',this.value)"><button class="del" onclick="delRow(\''+p+'\','+i+')">×</button></div>';
    h+=calcLine(p+'.'+i+'.pl','예산','p');
    if(withActual)h+=calcLine(p+'.'+i+'.ac','결산','a');
    h+='<div class="bline"><input type="text" style="flex:1" value="'+esc(r.d)+'" placeholder="비고" oninput="set(\''+p+'.'+i+'.d\',this.value)"></div>';
    h+='<div class="bout" id="bo-'+i+'"><span class="bbasis">'+(withActual
        ? '예산 '+won(pc.amt)+'원 · 결산 '+won(ac.amt)+'원'
        : (pc.basis?esc(pc.basis):'<span class="empty">단가와 수량을 입력하세요</span>'))
      +'</span><b class="bamt">'+(withActual?(pc.amt?Math.round(ac.amt/pc.amt*100):0)+'%':won(pc.amt)+'원')+'</b></div></div>';
  });
  const blank={a:"",d:"",pl:emptyCalc(),ac:emptyCalc()};
  return h+'<button class="add" onclick=\'addRow("'+p+'",'+JSON.stringify(blank)+')\'>+ 예산 항목 추가</button>';
}
function totalP(){return (C().budget||[]).reduce((s,r)=>s+calcCell(r.pl).amt,0);}
function totalA(){return (C().budget||[]).reduce((s,r)=>s+calcCell(r.ac).amt,0);}
function execRate(){const p=totalP();return p?Math.round(totalA()/p*100):0;}
function refreshCalc(){
  const withA=(S.tab!=='plan');
  (C().budget||[]).forEach((r,i)=>{
    const el=document.getElementById('bo-'+i);if(!el)return;
    const pc=calcCell(r.pl),ac=calcCell(r.ac);
    if(withA){el.querySelector('.bbasis').textContent='예산 '+won(pc.amt)+'원 · 결산 '+won(ac.amt)+'원';
      el.querySelector('.bamt').textContent=(pc.amt?Math.round(ac.amt/pc.amt*100):0)+'%';}
    else{el.querySelector('.bbasis').innerHTML=pc.basis?esc(pc.basis):'<span class="empty">단가와 수량을 입력하세요</span>';
      el.querySelector('.bamt').textContent=won(pc.amt)+'원';}
  });
  const s=document.getElementById('bsum');
  if(s)s.textContent = withA
    ? '예산 '+won(totalP())+'원 · 집행 '+won(totalA())+'원 · 집행율 '+execRate()+'%'
    : won(totalP())+'원';
}

function renderForm(){
  ['common','plan','report'].forEach(t=>{
    document.getElementById('t-'+t).className = S.tab===t ? ('on'+(t==='common'?' neutral':'')) : '';
  });
  document.getElementById('form').innerHTML =
    S.tab==='common' ? commonForm() : S.tab==='plan' ? planForm() : reportForm();
}

function planForm(){

function ulList(a,ph){
  const it=(a||[]).filter(x=>x&&String(x).trim());
  return '<ul class="d">'+(it.length?it.map(x=>'<li>'+nl(x)+'</li>').join(''):'<li class="empty">'+ph+'</li>')+'</ul>';
}
function docTable(rows,cols,widths,ph){
  let h='<div class="tblwrap"><table class="doc"><thead><tr>';
  cols.forEach((c,i)=>h+='<th'+(widths?.[i]?' style="width:'+widths[i]+'"':'')+'>'+esc(c.t)+'</th>');
  h+='</tr></thead><tbody>';
  if(!rows||!rows.length)h+='<tr><td colspan="'+cols.length+'"><span class="empty">'+(ph||'입력된 내용이 없습니다')+'</span></td></tr>';
  (rows||[]).forEach((r,ri)=>{h+='<tr>';cols.forEach(c=>h+='<td>'+(c.k==='#'?(ri+1):cell(r[c.k]))+'</td>');h+='</tr>';});
  return h+'</tbody></table></div>';
}
function contentDoc(blocks,ph){
  if(!blocks||!blocks.length)return '<p class="empty">'+(ph||'사업내용 항목을 추가하세요')+'</p>';
  let h='';
  blocks.forEach(b=>{
    h+='<h3 class="dh3">'+(b.t&&b.t.trim()?esc(b.t):'<span class="empty">제목 없는 항목</span>')+'</h3>';
    if(b.type==='table'){
      h+='<div class="tblwrap"><table class="doc"><thead><tr>';
      b.cols.forEach((c,ci)=>h+='<th'+(b.w?.[ci]&&b.w[ci]!=='auto'?' style="width:'+b.w[ci]+'"':'')+'>'+nl(c)+'</th>');
      h+='</tr></thead><tbody>';
      if(!b.rows.length)h+='<tr><td colspan="'+b.cols.length+'"><span class="empty">입력된 내용이 없습니다</span></td></tr>';
      b.rows.forEach(r=>{h+='<tr>';b.cols.forEach((_,ci)=>h+='<td>'+cell(r[ci]??'')+'</td>');h+='</tr>';});
      h+='</tbody></table></div>';
    }else if(b.type==='list')h+=ulList(lines(b.text),'내용을 입력하세요');
    else h+=paras(b.text,'내용을 입력하세요');
    if(b.note&&b.note.trim())h+='<p class="callout">'+nl(b.note)+'</p>';
  });
  return h;
}

/* ================= 기획안 자동 채우기 (워드·텍스트 → 유형 선택 + 항목 배치) ================= */
const imp={text:'',src:'',cat:null,res:null,mode:'new',raw:false,open:null};

/* --- .docx 읽기: zip 을 직접 풀어 word/document.xml 의 문단·표만 뽑는다 (외부 라이브러리 없음) --- */
async function zipEntry(buf,name){
  const dv=new DataView(buf),u8=new Uint8Array(buf),dec=new TextDecoder();
  let e=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break;}}
  if(e<0)throw new Error('zip');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),

  (sec.budget||[]).forEach(L=>{const b=impBudget(L);if(b)res.budget.push(b);else if(!impIsHdr(impCells(L))&&!/^(합\s*계|총\s*계|소\s*계|총\s*액|계)(\s|:|：|$)/.test(impStrip(L)))res.leftover.push(L);});
  /* 평가지표 · 성과물 */
  (sec.kpi||[]).forEach(L=>{const k=impKpi(L);if(k&&k.b)res.kpi.push(k);});
  if(cat==='consult'&&map.output){/* 컨설팅은 산출물 표가 따로 있음 */}
  else (sec.output||[]).forEach(L=>{
    const p=impCells(impStrip(L));
    if(p.length>=2){if(!impIsHdr(p))res.outputs.push({a:p[0],b:p[1],c:p[2]||'',d:'',e:''});return;}
    const t=impStrip(L),q=t.match(/(\d+)\s*(부|건|식|개|매|권|종|벌)\b/);
    res.outputs.push({a:'',b:t,c:q?q[1]+q[2]:'',d:'',e:''});
  });
  /* 표(블록)형 */
  const fillBlock=(secId)=>{
    const title=map[secId];if(!title||!(sec[secId]||[]).length)return false;
    const b=tpl.blocks().find(x=>x.t===title);if(!b)return false;
    const kind=title==='프로그램'?'time':(/일정|진행계획/.test(title)?'date':'plain');
    const n=b.cols.length,rows=[];
    sec[secId].forEach(L=>{
      const parts=impCells(L);
      if(impIsHdr(parts))return;
      const cont=!/\t/.test(L)&&/^\s*[-·•ㆍ]/.test(L);
      if(cont&&rows.length&&n>=3){const r=rows[rows.length-1],ci=Math.min(2,n-1);r[ci]=(r[ci]?r[ci]+'\n':'')+L.trim().replace(/^[·•ㆍ]/,'-');return;}
      rows.push(impRow(L,n,kind));
    });
    if(rows.length)res.blocks[title]=rows;
    return rows.length>0;
  };
  Object.keys(map).forEach(fillBlock);
  /* 이 유형에 없는 표 섹션은 인식 못한 내용으로 */
  ['program','schedule','target','distrib','consultant'].forEach(id=>{if(!map[id])(sec[id]||[]).forEach(L=>res.leftover.push(L));});
  if(cat==='consult'&&map.output&&(sec.output||[]).length&&!res.blocks[map.output])fillBlock('output');
  if(sec.promo&&sec.promo.length)res.invite=sec.promo.join('\n');
  /* 예산과목: 문서 안에 세목 이름이 있으면 자동 선택 */
  res.acct=ACCT.findIndex(a=>text.includes(a[2]));
  res.leftover=res.leftover.concat(pre.filter(x=>x.trim()&&!/(계획서|기획안|기획서|계획\s*\(안\)|계획안)\s*$/.test(x.trim())));
  res.secCount=secSeen.size;
  return res;
}

function impIsSample(){return impNorm(C().title)===impNorm(seed().common.title)||!String(C().title||'').trim();}
function impApply(){
  const r=imp.res;if(!r)return;
  if(imp.mode==='new'&&!impIsSample()){
    if(!confirm('지금 작성 중인 내용이 지워지고 새 문서로 시작합니다.\n(보관하려면 먼저 [사업파일 저장]을 하세요)\n\n계속할까요?'))return;
  }
  if(imp.mode==='new'){const t=S.tab;S=blankDoc(r.cat);S.tab=t;if(t!=='common')S.mode=t;}
  const c=C();
  c.category=r.cat;applyCategory(r.cat);
  const empty=v=>!String(v==null?'':v).trim();
  const emptyArr=a=>!a||!a.length||a.every(empty);
  ['kicker','title','target','period','writer','writeDate','reportDate','org'].forEach(k=>{if(r.f[k]&&empty(c[k]))c[k]=r.f[k];});
  /* 개요표 */
  c.outline=c.outline||[];
  Object.keys(r.outline).forEach(l=>{
    const row=c.outline.find(x=>x.k===l);
    if(row){if(empty(row.v))row.v=r.outline[l];}else c.outline.push({k:l,v:r.outline[l]});
  });
  r.extra.forEach(e=>{if(!c.outline.some(x=>x.k===e.k))c.outline.push({k:e.k,v:e.v});});
  if(emptyArr(c.background)&&r.background.length)c.background=r.background;
  if(emptyArr(c.purpose)&&r.purpose.length)c.purpose=r.purpose;
  if(emptyArr(S.plan.effects)&&r.effects.length)S.plan.effects=r.effects;
  if(!(c.budget||[]).length&&r.budget.length)c.budget=r.budget;
  if(!(c.kpi||[]).length&&r.kpi.length)c.kpi=r.kpi;
  if(!(c.outputs||[]).length&&r.outputs.length)c.outputs=r.outputs;
  if(r.invite&&empty(S.plan.invite))S.plan.invite=r.invite;
  Object.keys(r.blocks).forEach(t=>{
    const b=(c.content||[]).find(x=>x.t===t);
    if(b&&blockBlank(b)){b.rows=r.blocks[t].map(x=>impShape(x,b.cols.length));}
  });
  if(imp.raw&&r.leftover.length){
    c.content.push({t:'기획안 원문 (정리 필요)',type:'text',cols:[],w:[],rows:[],text:r.leftover.map(impStrip).join('\n'),note:''});
  }
  if(r.acct>=0&&empty(c.account.hang)){const a=ACCT[r.acct];c.account.hang=a[0];c.account.mok=a[1];c.account.semok=a[2];}
  const n=imp.src||'붙여넣은 글';
  imp.res=null;imp.text='';imp.src='';imp.cat=null;
  render();stash();window.scrollTo(0,0);
  toast('“'+(c.title||n)+'” 내용을 채웠습니다 — 빈 곳과 숫자를 확인해 주세요');
}

async function impFile(f){
  if(!f)return;
  const n=f.name.toLowerCase();
  try{
    let t='';
    if(n.endsWith('.docx'))t=await readDocx(f);
    else if(/\.(txt|md|text|csv)$/.test(n))t=await f.text();
    else if(/\.hwpx?$/.test(n)){toast('한글 파일은 직접 읽지 못합니다. 워드(.docx)로 저장하거나 내용을 붙여넣어 주세요');return;}
    else if(n.endsWith('.doc')){toast('구형 .doc 파일은 읽지 못합니다. .docx 로 저장해 주세요');return;}
    else{toast('.docx 또는 텍스트 파일을 올려 주세요');return;}
    if(!t.trim()){toast('파일에서 글을 찾지 못했습니다');return;}
    imp.text=t;imp.src=f.name;imp.cat=null;impAnalyze();
  }catch(e){toast('파일을 읽지 못했습니다. 손상되었거나 암호가 걸린 파일일 수 있습니다');}
}

/* ================= 저장 · 내보내기 ================= */
let dirty=false, savedAt='';
function updateStatus(){
  const el=document.getElementById('status');if(!el)return;
  if(dirty){el.textContent='변경됨 · 사업파일 저장 권장';el.className='status dirty';}
  else if(savedAt){el.textContent='사업파일 저장 '+savedAt;el.className='status on';}
  else {el.textContent='';el.className='status';}
}
/* 앱 저장소를 쓸 수 있으면 조용히 임시 보관한다. 실패해도 아무 표시를 하지 않는다. */
async function stash(){try{await window.storage.set(KEY,JSON.stringify(S));}catch(e){}}

function stamp(){const d=new Date();
  return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}
function clock(){const d=new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}

/* 사업파일 저장 : 입력값만 담은 데이터 파일. 지원 브라우저(크롬·엣지)에서는 저장 위치(폴더)를 직접 고른다. */
let lastSaveHandle=null;
function markSaved(msg){dirty=false;savedAt=clock();updateStatus();toast(msg);}
function fallbackDownload(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  markSaved('사업파일을 내려받았습니다 — 브라우저 다운로드 폴더를 확인하세요');
}
async function dlData(){
  const pack={_app:'mapo-doc-tool',_v:3,_savedAt:new Date().toISOString(),data:S};
  const name=((C().title||'사업문서').replace(/[\\/:*?"<>|]/g,'').trim()||'사업문서')+'_'+stamp()+'.json';
  const blob=new Blob([JSON.stringify(pack,null,1)],{type:'application/json'});
  if(window.showSaveFilePicker){
    try{
      const opt={suggestedName:name,types:[{description:'사업파일 (JSON)',accept:{'application/json':['.json']}}]};
      if(lastSaveHandle)opt.startIn=lastSaveHandle;   /* 지난번 저장한 폴더에서 시작 */
      const h=await window.showSaveFilePicker(opt);
      const w=await h.createWritable();await w.write(blob);await w.close();
      lastSaveHandle=h;
      markSaved('저장했습니다 — '+h.name);
      return;
    }catch(e){
      if(e&&e.name==='AbortError')return;            /* 사용자가 취소 */
      /* 폴더 선택창을 쓸 수 없는 환경(제한된 창 등)이면 일반 다운로드로 대체 */
    }
  }
  fallbackDownload(blob,name);
}
/* 사업파일 불러오기 */
function loadFile(input){
  const f=input.files&&input.files[0];input.value='';
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    let obj;
    try{obj=JSON.parse(r.result);}catch(e){toast('사업파일을 읽지 못했습니다. 파일이 손상되었을 수 있습니다');return;}
    const d=obj&&obj.data?obj.data:obj;
    if(!d||typeof d!=='object'||!d.common){toast('이 도구의 사업파일이 아닙니다');return;}
    const nm=(d.common&&d.common.title)||'제목 없음';
    if(!confirm('“'+nm+'”을(를) 불러옵니다.\n지금 작성 중인 내용은 사라집니다. 계속할까요?'))return;
    S=d;migrate();
    dirty=false;savedAt='';updateStatus();
    document.body.classList.toggle('report',M()==='report');
    render();stash();
    toast('불러왔습니다 — '+nm);
  };
  r.onerror=()=>toast('파일을 열지 못했습니다');
  r.readAsText(f,'utf-8');
}

function migrate(){
  const d=seed();
  S.tab=S.tab||'plan';S.mode=S.mode||'plan';
  const hadRD=!!(S.common&&S.common.reportDate!==undefined);
  S.common=Object.assign({},d.common,S.common||{});
  if(!hadRD)S.common.reportDate='';
  S.plan=Object.assign({},d.plan,S.plan||{});
  S.report=Object.assign({},d.report,S.report||{});
  const old=S.meta;
  if(old){['kicker','title','target','period','writer','writeDate','org'].forEach(k=>{if(old[k]!==undefined)S.common[k]=old[k];});delete S.meta;}
  if(S.plan.outline){S.common.outline=S.plan.outline;delete S.plan.outline;}
  if(S.plan.purpose){S.common.purpose=S.plan.purpose;delete S.plan.purpose;}
  if(S.plan.content){S.common.content=S.plan.content;delete S.plan.content;}
  if(S.plan.account){S.common.account=S.plan.account;delete S.plan.account;}
  if(S.plan.kpi){S.common.kpi=S.plan.kpi.map(r=>({a:r.a||'',b:r.b||'',c:r.c||'',d:r.d||''}));delete S.plan.kpi;}
  if(S.plan.budget){S.common.budget=S.plan.budget.map(r=>({a:r.a||'',d:r.d||'',
    pl:r.pl||{p:r.p||'',f:r.f||[],manual:!!r.manual,c:r.c||'',amt:r.amt||''},ac:r.ac||emptyCalc()}));delete S.plan.budget;}
  if(S.report.background){S.common.background=S.report.background;delete S.report.background;}
  delete S.report.purpose;delete S.report.budget;delete S.report.budgetHead;
  if(S.report.outputs){S.common.outputs=S.report.outputs.map(r=>({a:r.a||'',b:r.b||'',c:'',d:r.c||'',e:r.d||''}));delete S.report.outputs;}
  if(S.report.perf&&S.report.perf.quant)delete S.report.perf.quant;
  if(typeof S.report.linked!=='boolean')S.report.linked=!(S.report.content&&S.report.content.length);
  (S.common.budget||[]).forEach(r=>{r.pl=r.pl||emptyCalc();r.ac=r.ac||emptyCalc();
    [r.pl,r.ac].forEach(c=>{c.f=[0,1,2].map(k=>(c.f||[])[k]||{v:'',u:''});});});
  if(typeof S.plan.showInvite!=='boolean')S.plan.showInvite=true;
  /* 사업성과: 예전의 문장 목록 → 목록형 블록 하나로 */
  if(Array.isArray(S.report.results) && S.report.results.some(x=>typeof x==='string')){
    const txt=S.report.results.filter(x=>typeof x==='string'&&x.trim()).join('\n');
    S.report.results = txt ? [{t:'주요 성과',type:'list',cols:[],w:[],rows:[],text:txt,note:''}] : [];
  }
  if(!Array.isArray(S.report.results))S.report.results=[];
  (S.common.kpi||[]).forEach(r=>{if(r.d===undefined)r.d='';});
  (S.common.outputs||[]).forEach(r=>{['a','b','c','d','e'].forEach(k=>{if(r[k]===undefined)r[k]='';});});
}
async function load(){
  try{const r=await window.storage.get(KEY);
    if(r&&r.value){S=JSON.parse(r.value);migrate();}
  }catch(e){}
  document.body.classList.toggle('report',M()==='report');
  render._quiet=true;render();render._quiet=false;
  dirty=false;updateStatus();
}
/* 새 사업 시작용: 입력값을 모두 비우고, 현재 사업유형의 기본 항목만 남긴다 */
function blankDoc(cat){
  const d=seed(),t=new Date();
  d.common=Object.assign({},d.common,{
    category:cat,kicker:'',title:'',target:'',period:'',writer:'',reportDate:'',
    writeDate:t.getFullYear()+'. '+(t.getMonth()+1)+'. '+t.getDate(),
    background:[],purpose:[],outline:[],content:[],
    account:{src:'보조금',gwan:'사업비',hang:'',mok:'',semok:''},
    budget:[],kpi:[],outputs:[]});
  d.plan={showInvite:true,invite:'',effects:[]};
  d.report={linked:true,content:[],results:[],perf:{sub:'',act:'',qual:[]},review:[],suggest:[],attach:[]};
  return d;
}
function clearAll(){
  const cat=C().category||'event';
  if(!confirm('작성한 내용을 모두 지우고 빈 양식으로 시작합니다.\n(사업유형 “'+CATS[cat].name+'”의 기본 항목만 남습니다)\n\n지금 내용을 보관하려면 먼저 [사업파일 저장]을 하세요. 계속할까요?'))return;
  const t=S.tab;S=blankDoc(cat);S.tab=t;if(t!=='common')S.mode=t;
  applyCategory(cat);
  document.body.classList.toggle('report',M()==='report');
  dirty=false;savedAt='';render();dirty=false;updateStatus();stash();
  window.scrollTo(0,0);toast('초기화했습니다 — 빈 양식으로 시작하세요');
}
function resetAll(){
  if(!confirm('예시 내용(돌봄통합지원법 교육)으로 채웁니다. 지금 내용은 사라집니다. 계속할까요?'))return;
  const t=S.tab;S=seed();S.tab=t;if(t!=='common')S.mode=t;render();stash();toast('예시 내용으로 채웠습니다');
}
function fname(ext){
  const t=(M()==='plan'?'사업계획서':'결과보고서');
  return ((C().title||'문서').replace(/[\\/:*?"<>|]/g,'').trim()+'_'+t)+'.'+ext;
}
function copyDoc(){
  const el=document.getElementById('sheet'),html=el.innerHTML,text=el.innerText;
  if(navigator.clipboard&&window.ClipboardItem){
    navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})])
      .then(()=>toast('복사했습니다. 한글·워드에 붙여넣으세요')).catch(fb);
  }else fb();
  function fb(){navigator.clipboard.writeText(text).then(()=>toast('텍스트로 복사했습니다')).catch(()=>toast('복사하지 못했습니다'));}
}
function dlWord(){
  if(!dateOk())return;
  const accent=M()==='plan'?'#5B3E8E':'#1F6E63', soft=M()==='plan'?'#EFE9F7':'#E4F1EE';
  /* A4 세로 · 여백 상하 2cm / 좌우 1.8cm → 본문 폭 17.4cm */
  const css=`
    @page WordSection1{size:21cm 29.7cm;margin:2cm 1.8cm 2cm 1.8cm;mso-header-margin:1cm;mso-footer-margin:.9cm;mso-footer:f1;mso-page-orientation:portrait}
    div.WordSection1{page:WordSection1}
    body{font-family:'맑은 고딕','Malgun Gothic',sans-serif;font-size:10.5pt;color:#1B2430;line-height:1.55;word-break:keep-all}
    p{margin:0}
    p.para{margin:0 0 4pt}
    p.cl{margin:0}
    p.hang{margin-left:8pt;text-indent:-8pt}
    .doc-kicker{font-size:9.5pt;color:${accent};font-weight:bold;margin:0 0 4pt}
    .doc-title{font-size:19pt;font-weight:bold;margin:0 0 3pt;line-height:1.25}
    .doc-sub{font-size:11pt;color:#4A5765;margin:0 0 10pt}
    .doc-meta{font-size:9pt;color:#7E8A97;border-top:1.5pt solid ${accent};border-bottom:.5pt solid #D7DDE4;padding:5pt 0;margin-bottom:12pt}
    .doc-meta span{margin-right:16pt}
    h2.dh{font-size:12.5pt;font-weight:bold;margin:16pt 0 6pt;padding-bottom:3pt;border-bottom:1pt solid #1B2430;page-break-after:avoid}
    h3.dh3{font-size:10.5pt;font-weight:bold;margin:10pt 0 4pt;page-break-after:avoid}
    h4.dh4{font-size:10pt;font-weight:bold;margin:8pt 0 3pt;color:#4A5765;page-break-after:avoid}
    table{border-collapse:collapse;width:100%;font-size:9.5pt;margin:2pt 0 6pt;line-height:1.4}
    tr{page-break-inside:avoid}
    th{background:${soft};border:.5pt solid #B0B8C1;padding:3pt 5pt;text-align:left;font-weight:bold;vertical-align:top}
    td{border:.5pt solid #B0B8C1;padding:3pt 5pt;vertical-align:top}
    td.n{text-align:right;white-space:nowrap}
    tr.total td{background:${soft};font-weight:bold}
    table.box{margin:2pt 0 6pt}
    table.box td{border:.5pt solid #D7DDE4;background:#F8F8FB;padding:9pt 12pt;font-size:10pt;line-height:1.8}
    .cap{display:block;font-size:8pt;color:#7E8A97}
    .unit{text-align:right;font-size:8.5pt;color:#7E8A97;margin:0 0 2pt;page-break-after:avoid}
    .callout{border-left:3pt solid ${accent};background:#FAFAFC;padding:5pt 8pt;font-size:9.5pt;color:#4A5765;margin:4pt 0 0;page-break-inside:avoid}
    .empty{color:#B4BDC6}
    ul,ol{margin:0 0 4pt;padding-left:16pt} li{margin-bottom:2pt}
  `;
  /* 본문 정리: 워드가 해석하지 못하는 요소를 미리 바꿔 둔다 */
  const root=document.getElementById('sheet').cloneNode(true);
  /* ① ::before 로 그린 '○' 는 워드로 넘어가지 않으므로 글자로 넣는다 */
  root.querySelectorAll('h3.dh3').forEach(h=>{
    const sp=document.createElement('span');sp.setAttribute('style','color:'+accent);sp.textContent='○ ';
    h.insertBefore(sp,h.firstChild);
  });
  /* ② 가로 스크롤용 감싸개 제거 */
  root.querySelectorAll('.tblwrap').forEach(w=>{const t=w.querySelector('table');if(t)w.replaceWith(t);});
  /* ③ 홍보물 상자는 한 칸짜리 표로 (테두리·배경이 확실히 나오도록) */
  root.querySelectorAll('.invite').forEach(d=>{
    const t=document.createElement('table');t.className='box';
    t.insertRow().insertCell().innerHTML=d.innerHTML;d.replaceWith(t);
  });
  /* ④ 표는 본문 폭에 맞추고, 행은 쪽 경계에서 끊기지 않게 */
  root.querySelectorAll('table').forEach(t=>{t.setAttribute('width','100%');t.setAttribute('cellspacing','0');t.setAttribute('cellpadding','0');});
  root.querySelectorAll('tr').forEach(tr=>{tr.style.pageBreakInside='avoid';});

  /* 태그 문자열은 '<' 를 분리해 조립한다. 일부 모바일 뷰어가 스크립트 안의
     태그·주석을 실제 마크업으로 오해해 스크립트를 끊어버리기 때문. */
  const L='<';
  const fld=(code,dummy)=>
     L+'!--[if supportFields]>'+L+'span style="mso-element:field-begin">'+L+'/span> '+code+' '+L+'span style="mso-element:field-separator">'+L+'/span>'+L+'![endif]-->'
    +L+'span style="mso-no-proof:yes">'+dummy+L+'/span>'
    +L+'!--[if supportFields]>'+L+'span style="mso-element:field-end">'+L+'/span>'+L+'![endif]-->';
  const footer=L+'div style="mso-element:footer" id="f1">'
    +L+'p class="MsoFooter" style="text-align:center;font-size:9pt;color:#7E8A97">'
    +fld('PAGE','1')+' / '+fld('NUMPAGES','1')
    +L+'/p>'+L+'/div>';
  const html=L+'html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'
   +L+'head>'+L+'meta charset="utf-8">'+L+'title>'+esc(C().title)+L+'/title>'
   +L+'!--[if gte mso 9]>'+L+'xml>'+L+'w:WordDocument>'+L+'w:View>Print'+L+'/w:View>'+L+'w:Zoom>100'+L+'/w:Zoom>'+L+'/w:WordDocument>'+L+'/xml>'+L+'![endif]-->'
   +L+'style>'+css+L+'/style>'
   +L+'/head>'+L+'body>'+L+'div class="WordSection1">'+root.innerHTML+L+'/div>'+footer+L+'/body>'+L+'/html>';
  const url=URL.createObjectURL(new Blob(['\ufeff'+html],{type:'application/msword;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download=fname('doc');a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('워드 파일을 내려받았습니다 (A4 세로)');
}

pane('form');
load();
</script>
